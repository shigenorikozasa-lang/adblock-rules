name: 毎週最新の広告ルールを自動更新・配信

on:
  schedule:
    # 毎週月曜日の日本時間 12:00 (UTC 03:00) に自動実行
    - cron: '0 3 * * 1'
  workflow_dispatch: # GitHubの画面から手動でポチッと実行も可能

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動プッシュ権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: 最新ルールの自動収集・生成スクリプトを実行
        run: |
          python scripts/generate_rules.py

      - name: 変更があれば自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blockerList.json ADBlock/ContentBlockerExtension/blockerList.json
          if git diff --staged --quiet; then
            echo "ルールに変更はありませんでした。"
          else
            git commit -m "chore: 毎週の最新広告ブロックルールの自動更新 [skip ci]"
            git push origin main
            echo "最新ルールをプッシュしました！"
          fi
